<template>
    <lightning-card title={title} icon-name="standard:merge">
        <div class="slds-var-p-horizontal_medium merge-container">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template lwc:if={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-var-m-bottom_small" role="alert">
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <!-- Merge -->
            <template lwc:if={isMergeMode}>
                <template lwc:if={hasUnmergeOptions}>
                    <div class="slds-box slds-theme_shade slds-var-m-bottom_medium">
                        <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">Merged into this record</h3>
                        <ul class="slds-has-dividers_bottom-space">
                            <template for:each={unmergeOptionRows} for:item="option">
                                <li key={option.key} class="slds-item">
                                    <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-gutters_x-small">
                                        <div class="slds-col slds-grow">
                                            <p class="slds-text-title_bold">{option.name}</p>
                                            <p class="slds-text-body_small slds-text-color_weak">
                                                Merged
                                                <lightning-formatted-date-time
                                                    value={option.mergedOn}
                                                    year="numeric"
                                                    month="short"
                                                    day="numeric"
                                                    hour="numeric"
                                                    minute="2-digit">
                                                </lightning-formatted-date-time>
                                                <template lwc:if={option.mergedByName}> by {option.mergedByName}</template>
                                            </p>
                                        </div>
                                        <div class="slds-col slds-grow-none">
                                            <lightning-button
                                                label="Unmerge"
                                                title={option.buttonTitle}
                                                icon-name="utility:undo"
                                                data-log-id={option.logId}
                                                disabled={isLoading}
                                                onclick={handleUnmergeStart}>
                                            </lightning-button>
                                        </div>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>

                <lightning-record-picker
                    label="Record to merge with"
                    placeholder="Search..."
                    object-api-name={objectApiName}
                    filter={pickerFilter}
                    value={selectedRecordId}
                    onchange={handleRecordSelect}>
                </lightning-record-picker>

                <template lwc:if={comparison}>
                    <lightning-radio-group
                        class="slds-var-m-top_medium slds-show"
                        name="masterRecord"
                        label="Master record (the record that is kept)"
                        options={masterOptions}
                        value={masterKey}
                        onchange={handleMasterChange}>
                    </lightning-radio-group>

                    <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-var-m-top_medium">
                        <div class="slds-col slds-grow">
                            <lightning-input
                                type="toggle"
                                label={differenceCountLabel}
                                checked={showOnlyDifferences}
                                message-toggle-active=""
                                message-toggle-inactive=""
                                onchange={handleShowOnlyDifferences}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-grow-none">
                            <lightning-button-group>
                                <lightning-button label="Use all from master" onclick={handleUseAllMaster}></lightning-button>
                                <lightning-button label="Use all from other" onclick={handleUseAllOther}></lightning-button>
                            </lightning-button-group>
                        </div>
                    </div>

                    <template lwc:if={hasRows}>
                        <c-record-merge-field-table
                            class="slds-show slds-var-m-top_small"
                            rows={rows}
                            left-header={masterHeader}
                            right-header={otherHeader}
                            table-label="Field comparison"
                            onvalueselect={handleValueSelect}>
                        </c-record-merge-field-table>
                    </template>
                    <template lwc:else>
                        <p class="slds-var-m-top_small slds-text-color_weak">These records have the same value in every field you can edit.</p>
                    </template>

                    <div class="slds-box slds-theme_shade slds-var-m-top_medium">
                        <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">Related records</h3>
                        <template lwc:if={hasRelatedToMove}>
                            <p>{relatedTotal} related record(s) will be moved to {masterName}:</p>
                            <ul class="slds-list_dotted">
                                <template for:each={relatedToMove} for:item="item">
                                    <li key={item.key}>{item.label}: {item.count}</li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:else>
                            <p>{otherName} has no related records to move.</p>
                        </template>
                        <template lwc:if={isSummaryIncomplete}>
                            <p class="slds-text-color_error slds-var-m-top_x-small">
                                Not every related object could be counted. All related records will still be moved during the merge.
                            </p>
                        </template>
                    </div>

                    <div class="slds-var-m-top_medium slds-text-align_right">
                        <lightning-button
                            variant="destructive"
                            label="Merge Records"
                            disabled={isLoading}
                            onclick={handleMerge}>
                        </lightning-button>
                    </div>
                </template>
            </template>

            <!-- Unmerge -->
            <template lwc:if={isUnmergeMode}>
                <c-record-unmerge
                    log-id={unmergeLogId}
                    onunmerged={handleUnmerged}
                    oncancel={handleUnmergeCancel}>
                </c-record-unmerge>
            </template>
        </div>
    </lightning-card>
</template>
