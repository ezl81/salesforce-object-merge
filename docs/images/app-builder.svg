<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
  </defs>

  <rect width="820" height="420" fill="#f3f3f3"/>

  <!-- Top bar -->
  <rect width="820" height="44" fill="#032d60"/>
  <text x="16" y="27" fill="#ffffff" font-size="15" font-weight="600">Lightning App Builder</text>
  <text x="250" y="27" fill="#c9d7ea">Account Record Page</text>
  <rect x="720" y="10" width="84" height="26" rx="4" fill="#0176d3"/>
  <text x="762" y="27" fill="#ffffff" text-anchor="middle" font-weight="600">Save</text>

  <!-- Components panel -->
  <rect x="12" y="56" width="190" height="352" rx="4" fill="#ffffff" stroke="#dddbda"/>
  <text x="24" y="80" font-weight="700" fill="#181818">Components</text>
  <rect x="24" y="90" width="166" height="28" rx="4" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="34" y="109" fill="#181818">merge</text>
  <text x="24" y="142" font-size="11" font-weight="700" fill="#706e6b">CUSTOM (1)</text>
  <rect x="24" y="150" width="166" height="34" rx="4" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/>
  <rect x="32" y="158" width="18" height="18" rx="3" fill="#7f8de1"/>
  <path d="M36 163 h4 l4 4 h2 M36 171 h4 l4 -4" stroke="#fff" stroke-width="1.6" fill="none"/>
  <text x="58" y="172" fill="#181818" font-weight="600">Record Merge</text>

  <!-- Canvas -->
  <rect x="214" y="56" width="382" height="352" rx="4" fill="#ffffff" stroke="#dddbda"/>
  <rect x="226" y="68" width="358" height="46" rx="4" fill="#f8f8f8" stroke="#e5e5e5"/>
  <text x="238" y="96" fill="#706e6b">Highlights Panel</text>
  <rect x="226" y="124" width="210" height="272" rx="4" fill="#f8f8f8" stroke="#e5e5e5"/>
  <text x="238" y="148" fill="#706e6b">Record Detail / Related</text>
  <rect x="446" y="124" width="138" height="80" rx="4" fill="#f8f8f8" stroke="#e5e5e5"/>
  <text x="458" y="148" fill="#706e6b">Activity</text>

  <!-- Dropped component -->
  <rect x="446" y="214" width="138" height="92" rx="4" fill="#ffffff" stroke="#0176d3" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="456" y="226" width="16" height="16" rx="3" fill="#7f8de1"/>
  <text x="478" y="239" font-weight="700" fill="#181818">Merge Records</text>
  <rect x="456" y="252" width="118" height="22" rx="3" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="464" y="267" font-size="11" fill="#706e6b">Search...</text>

  <path d="M190 167 C 300 180, 360 250, 440 258" stroke="#e8590c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="290" y="276" fill="#e8590c" font-weight="700">drag onto the page</text>

  <!-- Properties panel -->
  <rect x="608" y="56" width="200" height="352" rx="4" fill="#ffffff" stroke="#dddbda"/>
  <text x="620" y="80" font-weight="700" fill="#181818">Record Merge</text>
  <text x="620" y="112" font-size="12" fill="#444444">Card Title</text>
  <rect x="620" y="120" width="176" height="28" rx="4" fill="#ffffff" stroke="#0176d3" stroke-width="1.5"/>
  <text x="630" y="139" fill="#181818">Merge Records</text>
  <text x="620" y="176" font-size="12" fill="#444444">Set Component Visibility</text>
  <rect x="620" y="184" width="176" height="28" rx="4" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="630" y="203" fill="#0176d3">+ Add Filter</text>

  <!-- Callouts -->
  <g font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="196" cy="100" r="12" fill="#e8590c"/><text x="196" y="105">1</text>
    <circle cx="590" cy="214" r="12" fill="#e8590c"/><text x="590" y="219">2</text>
    <circle cx="802" cy="120" r="12" fill="#e8590c"/><text x="802" y="125">3</text>
    <circle cx="716" cy="23" r="12" fill="#e8590c"/><text x="716" y="28">4</text>
  </g>
</svg>
