<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="820" height="330" fill="#f3f3f3"/>

  <!-- Card -->
  <rect x="16" y="16" width="520" height="298" rx="6" fill="#ffffff" stroke="#dddbda"/>
  <rect x="32" y="32" width="24" height="24" rx="4" fill="#7f8de1"/>
  <path d="M37 39 h5 l5 5 h4 M37 49 h5 l5 -5" stroke="#fff" stroke-width="1.8" fill="none"/>
  <text x="66" y="50" font-size="15" font-weight="700" fill="#181818">Merge Records</text>

  <!-- Record picker -->
  <text x="32" y="90" font-size="12" fill="#444444">Record to merge with</text>
  <rect x="32" y="98" width="488" height="32" rx="4" fill="#ffffff" stroke="#c9c9c9"/>
  <rect x="40" y="105" width="18" height="18" rx="3" fill="#5867e8"/>
  <text x="66" y="119" fill="#181818">Acme Corporation</text>
  <text x="506" y="119" fill="#706e6b" text-anchor="middle">✕</text>

  <!-- Master radio group -->
  <text x="32" y="168" font-size="12" fill="#444444">Master record (the record that is kept)</text>
  <circle cx="42" cy="192" r="8" fill="#ffffff" stroke="#0176d3" stroke-width="1.5"/>
  <circle cx="42" cy="192" r="4" fill="#0176d3"/>
  <text x="58" y="197" fill="#181818">This record (Acme Corp)</text>
  <circle cx="42" cy="220" r="8" fill="#ffffff" stroke="#939393" stroke-width="1.5"/>
  <text x="58" y="225" fill="#181818">Selected record (Acme Corporation)</text>

  <!-- Outcome strip -->
  <rect x="32" y="248" width="236" height="50" rx="4" fill="#ebf7e6" stroke="#2e844a"/>
  <text x="44" y="268" font-size="12" font-weight="700" fill="#2e844a">KEPT</text>
  <text x="44" y="287" fill="#181818">Acme Corp (this page)</text>
  <rect x="284" y="248" width="236" height="50" rx="4" fill="#fef1ee" stroke="#ba0517"/>
  <text x="296" y="268" font-size="12" font-weight="700" fill="#ba0517">DELETED AFTER MERGE</text>
  <text x="296" y="287" fill="#181818">Acme Corporation</text>

  <!-- Callouts -->
  <g font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="536" cy="114" r="12" fill="#e8590c"/><text x="536" y="119">1</text>
    <circle cx="536" cy="206" r="12" fill="#e8590c"/><text x="536" y="211">2</text>
  </g>
  <g fill="#181818">
    <text x="560" y="110" font-weight="700">Pick the duplicate</text>
    <text x="560" y="128" fill="#444444">Search for another record</text>
    <text x="560" y="144" fill="#444444">of the same object.</text>
    <text x="560" y="202" font-weight="700">Choose the winner</text>
    <text x="560" y="220" fill="#444444">The master survives, keeps its</text>
    <text x="560" y="236" fill="#444444">Id, and receives all related</text>
    <text x="560" y="252" fill="#444444">records. The other record is</text>
    <text x="560" y="268" fill="#444444">logged and then deleted.</text>
  </g>
</svg>
